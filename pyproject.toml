[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aade-mydata-cli"
version = "0.1.0"
description = "Command-line client for the AADE myDATA ERP REST API v2.0.2"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mydata = "mydata_cli.cli:main"

[tool.setuptools.packages.find]
include = ["mydata_cli*"]
