[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aade-mydata-cli"
version = "0.2.0"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: OS Independent"]
description = "Command-line client for the AADE myDATA ERP REST API v2.0.2"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mydata = "mydata_cli.cli:main"
mydata-readonly = "mydata_cli.cli:read_only_main"

[tool.setuptools.packages.find]
include = ["mydata_cli*"]
